name: Kitchen Front Linux engine proof
on:
  push:
    branches: [codex/linux-engine-proof]
    paths:
      - .github/workflows/kitchenfront-linux-engine.yml
      - examples/kitchenfront-operator/scripts/fixture-engine-check.mjs
      - examples/kitchenfront-operator/scripts/package-linux-engine.mjs
      - examples/kitchenfront-operator/lib/linux-fixture-isolation.mjs
      - examples/kitchenfront-operator/test/linux-fixture-isolation.test.mjs
  workflow_dispatch:
    inputs:
      retain_engine_artifact:
        description: Upload one short-lived public Linux engine bundle after all proof steps pass.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kitchenfront-linux-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-engine:
    if: github.repository == 'benfr97/kitchenfront-codex'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Check exact reviewed engine tree and initial headroom
        run: |
          test "$(git rev-parse HEAD:codex-rs)" = 4d512d273d6bcd74b74b84de43a2090f8234a3d1
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -gt 2097152
      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler iproute2
      - name: Install exact upstream Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check example and namespace admission tests
        working-directory: examples/kitchenfront-operator
        run: node --test test/*.test.mjs
      - name: Compile the dedicated Linux engine
        working-directory: codex-rs
        run: cargo +1.95.0 build --locked --release -p codex-app-server --bin codex-app-server
      - name: Record source, executable size and dynamic libraries
        run: |
          binary="$PWD/codex-rs/target/release/codex-app-server"
          test -f "$binary"
          printf 'Engine source: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Rust tree: %s\n' "$(git rev-parse HEAD:codex-rs)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$binary" >> "$GITHUB_STEP_SUMMARY"
          printf 'Executable bytes: %s\n' "$(stat --format=%s "$binary")" >> "$GITHUB_STEP_SUMMARY"
          ldd "$binary"
      - name: Run the actual engine with a model-free fixture in a private network namespace
        run: |
          binary="$PWD/codex-rs/target/release/codex-app-server"
          script="$PWD/examples/kitchenfront-operator/scripts/fixture-engine-check.mjs"
          expected_hash="$(sha256sum "$binary" | cut -d ' ' -f1)"
          node_binary="$(command -v node)"
          wrapper="$RUNNER_TEMP/kf-netns-fixture.sh"
          # Preserve a kernel-backed handle to the original network namespace.
          # setpriv drops privilege without a PAM/FD-closing session boundary.
          cat > "$wrapper" <<'SH'
          #!/bin/sh
          set -eu
          if [ "$1" = enter ]; then
            shift
            exec 3</proc/self/ns/net
            exec /usr/bin/unshare --net -- "$0" inside "$@"
          fi
          test "$1" = inside
          shift
          /usr/sbin/ip link set lo up
          exec /usr/bin/setpriv --reuid "$1" --regid "$2" --init-groups --no-new-privs -- "$3" "$4" "$5" "$6"
          SH
          chmod 700 "$wrapper"
          sudo "$wrapper" enter "$(id -u)" "$(id -g)" "$node_binary" "$script" "$binary" "$expected_hash"
          printf '%s\n' 'Protocol fixture only: no genuine model or provider call; no hosted acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test opt-in package with synthetic fixture files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_engine_artifact == true }}
        run: node examples/kitchenfront-operator/scripts/package-linux-engine.mjs --self-test
      - name: Package the exact public engine, catalog and notices
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_engine_artifact == true }}
        run: >-
          node examples/kitchenfront-operator/scripts/package-linux-engine.mjs
          --binary codex-rs/target/release/codex-app-server
          --output "$RUNNER_TEMP/kitchenfront-linux-engine.tar.gz"
      # This remains opt-in to an explicit manual dispatch after the full
      # model-free fixture. The bundle contains only public engine inputs and
      # notices; it is not a deploy or a model/provider call.
      - name: Retain the single compressed public engine artifact for one day
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_engine_artifact == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Direct single-file upload uses this filename as the artifact name.
          path: ${{ runner.temp }}/kitchenfront-linux-engine.tar.gz
          archive: false
          retention-days: 1
          if-no-files-found: error
